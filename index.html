<html>
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syl's Birthday</title>

  <style>
    :root {
      --rose: #d4789d;
      --sage: #9fbeac;
      --periwinkle: #b5b4d6;
      --peony: #e5b4d4;
      --rosewood: #a46182;
      --granite: #405d58;
      --alabaster: #f4eeee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--granite);
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Text", "SF Pro Display", sans-serif;
        }

  h1,
  .modal h2 {
    font-family: Georgia, serif;
      background:
        radial-gradient(
          circle at 12% 18%,
          rgba(219, 178, 186, 0.25) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 82% 12%,
          rgba(154, 163, 136, 0.25) 0 2px,
          transparent 3px
        ),
        linear-gradient(135deg, #dddadb, #f3e8e8);
      background-size: 34px 34px, 48px 48px, auto;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image:
        radial-gradient(
          rgba(64, 93, 88, 0.35) 0.6px,
          transparent 0.6px
        );
      background-size: 5px 5px;
    }

    .page {
  position: relative;
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

    header {
  position: absolute;
  z-index: 5;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90vw, 900px);
  text-align: center;
  margin: 0;
  pointer-events: none;
}

.eyebrow {
  margin: 0 0 8px;
  color: #f6d9df;
  font: 700 12px/1.2 Arial, sans-serif;
  letter-spacing: 0.28em;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
}

h1 {
  margin: 0;
  color: #fff5e9;
  font-size: clamp(42px, 6vw, 82px);
  line-height: 1;
  font-weight: 700;
  text-shadow:
    0 3px 10px rgba(0, 0, 0, 0.45),
    0 0 30px rgba(0, 0, 0, 0.2);
}

.date {
  display: inline-block;
  margin: 16px 0 0;
  padding: 8px 18px;

  color: white;
  background: rgba(30, 40, 38, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;

  font: 14px/1.5 Arial, sans-serif;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);

  backdrop-filter: blur(8px);
}
    }

    
     .scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.scene > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);

  width: 56px;
  height: 56px;

  border: 0;
  padding: 0;
  background: transparent;

  cursor: pointer;
  touch-action: manipulation;
}

.marker {
  position: absolute;
  left: 50%;
  top: 50%;
  display: grid;
  width: 22px;
  height: 22px;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 0;
  border-radius: 50%;
  color: rgba(255, 250, 232, 0.94);
  background: transparent !important;
  font-size: 0;
  text-shadow:
    0 0 5px white,
    0 0 12px rgba(255, 232, 181, 0.72);
  animation: sparkle 3.2s ease-in-out infinite;
}

.marker::before {
  content: "✦";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 20px/1 Georgia, serif;
}

.marker::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 248, 220, 0.9);
  box-shadow: 0 0 7px rgba(255, 236, 184, 0.9);
}

@keyframes sparkle {
  0%,
  100% {
    opacity: 0.65;
    transform: translate(-50%, -50%) scale(0.9);
  }

  50% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.15);
  }
    }

    .hotspot:hover .marker,
    .hotspot:focus-visible .marker {
      transform: translate(-50%, -50%) scale(1.12);
    }

    .tooltip {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 22px);
      padding: 6px 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--granite);
      font: 700 12px Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .hotspot:hover .tooltip,
    .hotspot:focus-visible .tooltip {
      opacity: 1;
      transform: translate(-50%, 27px);
    }

   .progress {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);

  margin: 0;
  padding: 10px 24px;

  color: white;
  background: rgba(30, 40, 38, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;

  font: 14px/1.5 Arial, sans-serif;
  text-align: center;
  white-space: nowrap;

  backdrop-filter: blur(8px);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(64, 93, 88, 0.58);
      animation: fade 0.2s ease;
    }

    .modal {
      width: min(100%, 520px);
      max-height: min(720px, 90vh);
      overflow: auto;
      padding: 28px;
      border: 1px solid rgba(159, 190, 172, 0.7);
      border-radius: 26px;
      background: var(--alabaster);
      box-shadow: 0 24px 70px rgba(34, 55, 52, 0.3);
      animation: rise 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .icon {
      display: grid;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      place-items: center;
      border-radius: 17px;
      color: white;
      font-size: 24px;
    }

    .modal h2 {
      margin: 3px 0 0;
      font-size: 32px;
      line-height: 1.05;
    }

    .modal .eyebrow {
      letter-spacing: 0.18em;
    }

    .close {
      margin-left: auto;
      border: 0;
      color: var(--granite);
      background: transparent;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .body {
      margin: 22px 0;
      font: 15px/1.6 Arial, sans-serif;
    }

    dl {
      margin: 0;
    }

    .row {
      padding: 12px 0;
      border-top: 1px solid rgba(159, 190, 172, 0.55);
    }

    dt {
      color: var(--rosewood);
      font: 700 11px Arial, sans-serif;
      letter-spacing: 0.12em;
  
    }

    dd {
      margin: 4px 0 0;
      font: 16px/1.4 Arial, sans-serif;
    }

    .action,
    .back,
    .poll-option {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      color: white;
      background: var(--granite);
      font: 700 14px Arial, sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .back {
      margin-top: 22px;
      background: var(--rosewood);
    }

    .poll {
      margin-top: 20px;
    }

    .poll-title {
      margin: 0 0 10px;
      font: 700 14px Arial, sans-serif;
    }

    .poll-option {
      margin-top: 8px;
      color: var(--granite);
      background: #e5b4d4;
      text-align: left;
    }

    .poll-option.selected {
      color: white;
      background: var(--rosewood);
    }

    .note {
      margin: 12px 0 0;
      font: italic 13px/1.5 Arial, sans-serif;
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: 0.55;
      }

      70%,
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    @keyframes bob {
      0%,
      100% {
        transform: translate(-50%, -50%);
      }

      50% {
        transform: translate(-50%, calc(-50% - 3px));
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 20px, 768px);
        padding: 22px 0;
      }

      header {
        margin-bottom: 18px;
      }

      .scene {
        border-radius: 20px;
      }

      .modal {
        align-self: end;
        max-height: 86vh;
        padding: 24px 20px;
        border-radius: 24px 24px 18px 18px;
      }

      .overlay {
        align-items: end;
        padding: 10px;
      }

      .tooltip {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <p class="eyebrow">Sílvia is turning 28 yrs old!</p>

      <h1>Syl's Birthday</h1>

      <p class="date">
        tap the clues to discover every detail.
      </p>
    </header>

    <section
      class="scene"
   aria-label="Interactive woodland birthday scene"
>
  <img src="bg.png" alt="">    >

      <button
        class="hotspot"
        data-id="party"
        data-title="Syl's Bday Party"
        data-eyebrow="Don't be de after pfv"
        data-body="We’re taking over a clearing somewhere in the Sintra woods for an afternoon of food, games, questionable amounts of socialising, and whatever happens once the sun goes down."
        data-lines="Date|Sunday, 27 September 2026;Time|14h30 till lateeeee"
        data-footnote="Bring a bottle. Bring something to eat. Or send an MB WAY and let us handle it."
data-x="934"
  data-y="427"
        aria-label="Party details"
      >
        <span
          class="marker"
          style="background: #d4789d"
        >+</span>

        <span class="tooltip">
          Party details
        </span>
      </button>


      <button
        class="hotspot"
        data-id="location"
        data-title="Location"
        data-eyebrow="Find the clearing"
        data-body="Follow the map into the trees. Look for the clearing with the suspicious amount of sunlight."
        data-lines="Address|<br>Parque Natural de Sintra Cascais,<br>Estr. da Serra, QH3V+CX4 Alcabideche<br>38.753528, -9.405056<br>"
        data-action="Open in Google Maps"
        data-x="1321"
data-y="563"
        aria-label="Location"
      >
        <span
          class="marker"
          style="background: #9fbeac"
        >+</span>

        <span class="tooltip">
          Location
        </span>
      </button>


      <button
        class="hotspot"
        data-id="dress"
        data-title="Dress code"
        data-eyebrow="What to wear"
        data-body="We haven't decided yet.."
        data-footnote="For now: soft layers, clothes you don't mind sitting on the ground in, and shoes you can actually walk in"
data-x="678"
data-y="427"
        aria-label="Dress code"
      >
        <span
          class="marker"
          style="background: #e5b4d4"
        >+</span>

        <span class="tooltip">
          Dress code
        </span>
      </button>


      <button
        class="hotspot"
        data-id="games"
        data-title="Games"
        data-eyebrow="Something is being planned."
        data-body="Details coming soon."
        data-lines="Status|There will be games. There may be a little competition. Mostly, there will be good sportsmanship. Probably."
        data-x="560"
data-y="672"
        aria-label="Games"
      >
        <span
          class="marker"
          style="background: #b5b4d6"
        >+</span>

        <span class="tooltip">
          Games
        </span>
      </button>


      <button
  class="hotspot"
  data-id="rsvp"
  data-title="RSVP"
  data-eyebrow="Choose your arrival window."
  data-body=""
  data-poll="14:30 - 19:00|15:30 - 19:00|19:00 - 00:00"
        data-x="1295"
data-y="230"
  aria-label="Arrival poll"
        >
  <span class="marker" style="background: #d4789d">+</span>
  <span class="tooltip">Arrival poll</span>
</button>



      <button
        class="hotspot"
        data-id="rules"
        data-title="House rules"
        data-eyebrow="A tiny woodland rule"
        data-body="Phones will be asked to go in a box — not on silent."
        data-lines="Why|In case someone calls or texts, it can be heard."
        data-footnote="A little offline magic for everyone."
data-x="805"
data-y="646";
        aria-label="House rules"
      >
        <span
          class="marker"
          style="background: #a46182"
        >+</span>

        <span class="tooltip">
          House rules
        </span>
      </button>

    </section>

    <p class="progress" id="progress">
      6 clues to uncover — look for the glowing dots.
    </p>

  </main>


  <div id="modal-root" hidden></div>


  <script>
   const hotspots = document.querySelectorAll(".hotspot");

const scene = document.querySelector(".scene");
const sceneImage = scene.querySelector("img");

const IMAGE_WIDTH = 1920;
const IMAGE_HEIGHT = 990;

function positionHotspots() {
  const sceneWidth = scene.clientWidth;
  const sceneHeight = scene.clientHeight;

  if (!sceneWidth || !sceneHeight) return;

  // Calculate the scale used by object-fit: cover
  const scale = Math.max(
    sceneWidth / IMAGE_WIDTH,
    sceneHeight / IMAGE_HEIGHT
  );

  const displayedWidth = IMAGE_WIDTH * scale;
  const displayedHeight = IMAGE_HEIGHT * scale;

  // Because object-position is center
  const offsetX = (sceneWidth - displayedWidth) / 2;
  const offsetY = (sceneHeight - displayedHeight) / 2;

  hotspots.forEach(hotspot => {
    const x = Number(hotspot.dataset.x);
    const y = Number(hotspot.dataset.y);

    if (!Number.isFinite(x) || !Number.isFinite(y)) return;

    const screenX = x * scale + offsetX;
    const screenY = y * scale + offsetY;

    hotspot.style.left = `${screenX}px`;
    hotspot.style.top = `${screenY}px`;
  });
}

window.addEventListener("resize", positionHotspots);

sceneImage.addEventListener("load", positionHotspots);

positionHotspots();
}

window.addEventListener("resize", positionHotspots);

sceneImage.addEventListener("load", positionHotspots);

positionHotspots();
    const progress = document.querySelector("#progress");
    const modalRoot = document.querySelector("#modal-root");
    const visited = new Set();


    function updateProgress() {
      if (visited.size === 0) {
        progress.textContent =
          "6 clues to uncover — look for the glowing dots..";
        return;
      }

      if (visited.size === hotspots.length) {
        progress.textContent =
          "You've found everything. See you at the party!";
        return;
      }

      progress.textContent =
        `${visited.size} of ${hotspots.length} discovered — keep exploring.`;
    }


    function openModal(button) {
      visited.add(button.dataset.id);
      button.classList.add("seen");
      updateProgress();

      const data = button.dataset;

      const lines = data.lines
        ? data.lines
            .split(";")
            .map(item => {
              const [label, value] = item.split("|");

              return `
                <div class="row">
                  <dt>${label}</dt>
                  <dd>${value}</dd>
                </div>
              `;
            })
            .join("")
        : "";


      const poll = data.poll
        ? `
          <div class="poll">

            <p class="poll-title">
              What time do you plan to arrive?
            </p>

            ${data.poll
              .split("|")
              .map(
                option => `
                  <button class="poll-option">
                    ${option}
                  </button>
                `
              )
              .join("")}

            <p class="note">
              Please message us your choice directly —
              this is just to help you commit!
            </p>

          </div>
        `
        : "";


      const action = data.action
        ? `
          <a
            class="action"
            target="_blank"
            rel="noopener"
            href="https://www.google.com/maps/dir/?api=1&destination=38.753528,-9.405056"
          >
            ${data.action}
          </a>
        `
        : "";


      const marker = button.querySelector(".marker");

      modalRoot.innerHTML = `
        <div
          class="overlay"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
        >

          <article class="modal">

            <div class="modal-head">

              <div
                class="icon"
                style="background: ${marker.style.backgroundColor}"
              >
                ✦
              </div>

              <div>
                <p class="eyebrow">
                  ${data.eyebrow}
                </p>

                <h2 id="modal-title">
                  ${data.title}
                </h2>
              </div>

              <button
                class="close"
                aria-label="Close"
              >
                ×
              </button>

            </div>


            <p class="body">
              ${data.body}
            </p>


            ${
              lines
                ? `
                  <dl>
                    ${lines}
                  </dl>
                `
                : ""
            }


            ${action}

            ${poll}


            ${
              data.footnote
                ? `
                  <p class="note">
                    ${data.footnote}
                  </p>
                `
                : ""
            }


            <button class="back">
              Back to the party
            </button>

          </article>

        </div>
      `;


      modalRoot.hidden = false;
      document.body.style.overflow = "hidden";


      modalRoot.querySelector(".close").focus();


      modalRoot
        .querySelectorAll(".poll-option")
        .forEach(option => {

          option.addEventListener("click", () => {

            modalRoot
              .querySelectorAll(".poll-option")
              .forEach(item => {
                item.classList.remove("selected");
              });

            option.classList.add("selected");
          });

        });


      modalRoot
        .querySelector(".overlay")
        .addEventListener("click", event => {

          if (event.target.classList.contains("overlay")) {
            closeModal();
          }

        });


      modalRoot
        .querySelector(".close")
        .addEventListener("click", closeModal);


      modalRoot
        .querySelector(".back")
        .addEventListener("click", closeModal);
    }


    function closeModal() {
      modalRoot.hidden = true;
      modalRoot.innerHTML = "";
      document.body.style.overflow = "";
    }


    hotspots.forEach(button => {
      button.addEventListener("click", () => {
        openModal(button);
      });
    });


    document.addEventListener("keydown", event => {

      if (
        event.key === "Escape" &&
        !modalRoot.hidden
      ) {
        closeModal();
      }

    });
  </script>

</body>
</html>
