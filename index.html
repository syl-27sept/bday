  transform: translate(-50%, -50%);

  background: radial-gradient(
    circle,
    #FFF8E6 0%,
    #D99A3D77 55%,
    transparent 75%
  );
  cursor: pointer;
  animation: pulse 2.6s ease-in-out infinite;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  -webkit-tap-highlight-color: transparent;
}

.hotspot:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

  }
}
